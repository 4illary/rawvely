{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rawvely</title>

    <link rel="stylesheet" href="{% static 'series/css/inicio.css' %}">
</head>

<body>

    <main class="inicio">

        <a href="{% url 'login' %}" class="botao-login">
    Login
</a>

        <section class="conteudo">

            <!-- Logo -->
            <img
                src="{% static 'series/img/logo.png' %}"
                alt="Rawvely"
                class="logo"
            >

            <!-- Frase -->
            <p class="frase">
                Descubra e avalie
            </p>

            <!-- Descrição -->
            <p class="descricao">
                Encontre novas séries, organize suas favoritas
                e registre tudo o que você assiste.
            </p>

            <!-- Botão Explorar -->
            <a href="#" class="botao-explorar">
                Explorar séries
            </a>

        </section>

    </main>

</body>

</html>
