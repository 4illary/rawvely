{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Rawvely</title>

    <link rel="stylesheet" href="{% static 'series/css/login.css' %}">
</head>

<body>

    <main class="login-container">

        <<img
    src="{% static 'series/img/logo.png' %}"
    alt="Rawvely"
    class="logo"
>

        <h1>Bem-vindo de volta</h1>

        <p class="subtitle">
            Entre na sua conta Rawvely
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

            </div>

            <div class="input-group">

                <label for="password">
                    Senha
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                    >
                        Mostrar
                    </button>

                </div>

            </div>

            <div class="forgot">

                <a href="/esqueci-senha/">
                    Esqueci minha senha
                </a>

            </div>

            <button
    type="submit"
    class="login-button"
>
    Entrar
</button>

            <div class="divider">

                <span></span>

                <p>ou</p>

                <span></span>

            </div>

            <button
                type="button"
                class="google-button"
            >

                <span class="google-icon">
                    G
                </span>

                Continuar com Google

            </button>

        </form>

        <p class="register">

            Não tem uma conta?

            <a href="/criar-conta/">
                Criar conta
            </a>

        </p>

    </main>

    <script src="{% static 'series/js/login.js' %}"></script>

</body>

</html>
