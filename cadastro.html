{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Rawvely</title>

    <link rel="stylesheet" href="{% static 'series/css/cadastro.css' %}">
</head>

<body>

    <main class="cadastro-container">

        <section class="cadastro-card">

            <img
                src="{% static 'series/img/logo.png' %}"
                alt="Rawvely"
                class="logo"
            >

            <h1>Criar conta</h1>

            <p class="subtitle">
                Faça parte do Rawvely e descubra novas séries.
            </p>


            <form id="cadastroForm">

                <div class="input-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Seu nome"
                        required
                    >

                    <small id="erroNome"></small>

                </div>

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                    >

                    <small id="erroEmail"></small>

                </div>

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="senha"
                        >
                            Mostrar
                        </button>

                    </div>

                    <small id="erroSenha"></small>

                </div>

                <div class="input-group">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Digite a senha novamente"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmarSenha"
                        >
                            Mostrar
                        </button>

                    </div>

                    <small id="erroConfirmarSenha"></small>

                </div>

                <div class="generos">

                    <p>
                        Quais gêneros você gosta?
                    </p>

                    <span class="generos-opcional">
                        Opcional
                    </span>


                    <div class="generos-lista">

                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Drama"
                            >
                            <span>Drama</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Comédia"
                            >
                            <span>Comédia</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Ação"
                            >
                            <span>Ação</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Terror"
                            >
                            <span>Terror</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Ficção"
                            >
                            <span>Ficção</span>
                        </label>


                        <label>
                            <input
                                type="checkbox"
                                name="generos"
                                value="Romance"
                            >
                            <span>Romance</span>
                        </label>

                    </div>

                </div>

                <button
                    type="submit"
                    class="cadastro-button"
                >
                    Criar conta
                </button>


                <p
                    id="mensagemCadastro"
                    class="mensagem-cadastro"
                ></p>

            </form>

            <p class="login-link">

                Já tem uma conta?

                <a href="{% url 'login' %}">
                    Entrar
                </a>

            </p>

        </section>

    </main>


    <script src="{% static 'series/js/cadastro.js' %}"></script>

</body>

</html>
